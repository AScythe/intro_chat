[project]
name = "introchat"
version = "1.0.0"
description = "Anonymous micro-chat matching at events — FastAPI backend"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.0",
    "websockets==12.0",
    "jinja2==3.1.4",
    "aiosqlite==0.20.0",
    "python-multipart==0.0.9",
    "qrcode==7.4.2",
    "Pillow==10.0.1",
]

[dependency-groups]
dev = ["httpx>=0.28.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
